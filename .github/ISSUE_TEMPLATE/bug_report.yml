name: Bug report
description: Something in RuleBeat isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RuleBeat version or commit
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running RuleBeat?
      options:
        - Docker (self-hosted)
        - Built from source
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact anything sensitive (tenant IDs, subscription IDs, secrets).
      render: shell
